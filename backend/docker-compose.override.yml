# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.override.yml  — LOCAL DEVELOPMENT ONLY
# Automatically merged by docker-compose when present.
# Never commit secrets here.
# ─────────────────────────────────────────────────────────────────────────────

services:

  redis:
    # Expose Redis locally for redis-cli / RedisInsight
    ports:
      - "6379:6379"

  sp-api:
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      Serilog__MinimumLevel__Default: "Debug"
      Serilog__MinimumLevel__Override__Microsoft: "Information"
      Serilog__MinimumLevel__Override__Microsoft__EntityFrameworkCore__Database__Command: "Information"
